
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BugLens Demo Website</title>
  </head>
  <body>
    <div class="container">
      <header>
        <p class="tag">BUGLENS AI · QA PLAYGROUND</p>
        <h1>Demo Form Testing</h1>
        <p>Use this website to test form validation automatically.</p>
      </header>

      <section class="card">
        <h2>Registration Form</h2>
        <form id="registration-form">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" required minlength="3" />

          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" />

          <label class="checkbox">
            <input type="checkbox" name="terms" required />
            I agree to the terms and conditions
          </label>

          <button type="submit">Create Account</button>
          <p id="registration-message" role="status"></p>
        </form>
      </section>

      <section class="card">
        <h2>Contact Form</h2>
        <form id="contact-form">
          <label for="contact-email">Email Address</label>
          <input id="contact-email" name="email" type="email" required />

          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" required minlength="10"></textarea>

          <button type="submit">Send Message</button>
          <p id="contact-message" role="status"></p>
        </form>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
